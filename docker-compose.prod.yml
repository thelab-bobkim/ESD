version: "3.9"

# 운영(AWS Lightsail) 배포용 구성.
# - 외부에는 nginx(8001=HTTP, 443=HTTPS)만 노출한다. frontend(3000)/backend(4000)/db(5432)는 도커 내부 네트워크에서만 통신.
# - HTTPS 설정 방법은 HTTPS_SETUP.md 참조 (무료 도메인 + Let's Encrypt).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 환경변수를 설정하세요}
      POSTGRES_DB: employee_status
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d employee_status"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 주의: 이 서비스는 외부 포트를 노출하지 않는다(도커 내부 네트워크 전용).
    # 서버의 5432/tcp 방화벽 규칙(특정 IP 허용)은 호스트에 별도 설치된 DB가 있을 때를 위한 것이며
    # 이 컨테이너 DB에는 적용되지 않는다 — 필요하면 관리용으로만 임시로 포트를 열고 바로 닫을 것.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD}@db:5432/employee_status?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 환경변수를 설정하세요}
      PORT: 4000
      DAUOFFICE_CLIENT_ID: ${DAUOFFICE_CLIENT_ID:-}
      DAUOFFICE_CLIENT_SECRET: ${DAUOFFICE_CLIENT_SECRET:-}
      DAUOFFICE_API_URL: ${DAUOFFICE_API_URL:-https://api.daouoffice.com}
      DAUOFFICE_TLS_INSECURE: ${DAUOFFICE_TLS_INSECURE:-false}
      # 2026-09-18: 다우오피스 "전사 휴가현황" 스크래핑용 로그인 계정. .env.prod에 값을 채워도
      # 여기 등록되어 있지 않으면 컨테이너 안으로 전달되지 않는다(다른 다우오피스 변수들과 동일한 이유).
      DAUOFFICE_SCRAPE_USERNAME: ${DAUOFFICE_SCRAPE_USERNAME:-}
      DAUOFFICE_SCRAPE_PASSWORD: ${DAUOFFICE_SCRAPE_PASSWORD:-}
      DAUOFFICE_PORTAL_URL: ${DAUOFFICE_PORTAL_URL:-https://dsti.daouoffice.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_API_BASE_URL을 비워서 브라우저 접속 IP 기준 "/api/v1" 자동감지 사용
      args:
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      # 주의: 이 서버의 80번 포트는 이미 다른 서비스(maintenance_system-web)가 쓰고 있어서
      # 8001로 대신 노출한다. 8001은 방화벽에 이미 열려 있는 8000-8001 규칙 범위에 포함된다.
      - "8001:80"
      # HTTPS_SETUP.md 안내대로 인증서를 발급받은 뒤 사용한다(443은 이 서버에서 비어있는 포트).
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt 인증서(호스트의 /etc/letsencrypt)를 읽기전용으로 컨테이너에 공유
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  db_data:

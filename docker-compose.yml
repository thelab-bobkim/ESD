version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: CONFIGURABLE_change_me
      POSTGRES_DB: employee_status
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d employee_status"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_user:CONFIGURABLE_change_me@db:5432/employee_status?schema=public
      JWT_SECRET: CONFIGURABLE_change_me_in_env
      PORT: 4000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # 선택: DB를 브라우저에서 확인하고 싶을 때만 사용 (파일럿 운영에는 불필요하면 주석 처리 가능)
  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  db_data:

# ===== HTTP (기존 :8001 접속용 — 그대로 유지) =====
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 프론트엔드 (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 API (경로 그대로 전달: /api/v1/... -> backend:4000/api/v1/...)
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 다우오피스 동기화처럼 오래 걸리는 요청이 nginx 기본 타임아웃(60초)에 끊기지 않도록 연장
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# ===== HTTPS (dsti-tsb.duckdns.org, Let's Encrypt 인증서) =====
# 2026-08-30 보안점검: 저장소에는 이 블록이 계속 주석처리된 채로 남아있었는데, 실제 운영 주소는
# https://dsti-tsb.duckdns.org 로 이미 HTTPS가 붙어있다 — 서버에서 직접 이 파일을 손으로 고쳐서
# 켜두신 것으로 보인다(git엔 반영 안 됨). nginx가 이 파일을 이미지 안이 아니라 저장소 체크아웃 경로를
# 직접 마운트해서 쓰기 때문에, 서버의 실제 설정과 git 내용이 다르면 나중에 새로 클론하거나 파일을
# 실수로 되돌릴 때 HTTPS 설정이 통째로 날아갈 수 있다. 반드시 서버에 배포하기 전에, 서버에서
# `cat nginx/default.conf`로 지금 실제 켜져있는 내용과 이 파일을 비교해서 도메인/인증서 경로가
# 정확히 일치하는지 확인한 뒤 배포할 것 — 다르면 이 파일이 아니라 서버의 실제 값을 기준으로 고쳐야 한다.
server {
    listen 443 ssl;
    server_name dsti-tsb.duckdns.org;

    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/dsti-tsb.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsti-tsb.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
